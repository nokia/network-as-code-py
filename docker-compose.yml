services:
  sdk-codegen:
    # A Node.js image is a natural fit since `fern` is distributed via npm.
    # `jq` and the Docker CLI are added in the command below.
    # Pin this to a specific Node LTS version for reproducibility.
    image: node:22-bookworm-slim

    working_dir: /workspace

    # Bind-mount the project root into the container.
    # The generated SDK output directories live inside the repo, so changes
    # will be visible on the host after the container exits.
    volumes:
      - .:/workspace

      # ── Docker-outside-of-Docker (DooD) ──────────────────────────────────
      # Sharing the host socket lets Fern's local-mode generator spawn the
      # fernapi/fern-typescript-sdk and fernapi/fern-python-sdk containers
      # as sibling containers on the host daemon, exactly as it does when
      # run directly on the host.
      # - /var/run/docker.sock:/var/run/docker.sock # For when the system runs Docker or maps docker.sock -> podman.sock
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock # Just to make working with rootless podman work, same principle

      # Fern will volume mount directories in /tmp to the subcontainers
      # and this seems to fail somewhere in the top-level container, possibly
      # because the /tmp is not set up correctly. Passing host's /tmp as
      # a volume mount does work though.
      - /tmp:/tmp

    # Install prerequisites at runtime so the base image stays generic.
    # Swap this for a custom Dockerfile (see comment below) once you want
    # faster CI starts.
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y --no-install-recommends docker.io jq &&
        npm install -g fern-api &&
        sh cleanup-spec.sh &&
        sh generate-sdks.sh
      "

    # Prevent interactive prompts (fern already passes --no-prompt, but this
    # is a belt-and-suspenders measure for any other tool).
    environment:
      - CI=true
      - FERN_NO_VERSION_REDIRECTION=true   # skip version-check network calls

    # Keep the container around after it exits so you can inspect logs with
    # `docker compose logs sdk-codegen`. Remove for fully ephemeral CI runs.
    # restart: "no"   # default
