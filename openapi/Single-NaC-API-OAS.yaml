          format: date-time
          description: >-
            Timestamp of latest SIM swap performed. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z)
          nullable: true
          example: '2023-07-03T14:27:08.312+02:00'
    CheckSimSwapInfo-SIM-V1:
      type: object
      required:
        - swapped
      properties:
        swapped:
          type: boolean
          description: >-
            Indicates whether the SIM card has been swapped during the period within the provided age.
    PhoneNumber-SIM-V1:
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: '+346661113334'
      description: >-
        A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
    ErrorInfo-SIM-V1:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          description: HTTP response status code
        code:
          type: string
          description: Code given to this error
        message:
          type: string
          description: Detailed error description
    CreateCheckSimSwap-SIM-V1:
      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber-SIM-V1'
        maxAge:
          type: integer
          example: 240
          description: |
            Period in hours to be checked for SIM swap.
          format: int32
          minimum: 1
          maximum: 2400
          default: 240
    CreateSimSwapDate-SIM-V1:
      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber-SIM-V1'
    XCorrelator-DSWAP-V1:
      type: string
      pattern: '^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$'
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    DeviceSwapInfo-DSWAP-V1:
      type: object
      required:
        - latestDeviceChange
      properties:
        latestDeviceChange:
          type: string
          format: date-time
          description: >-
            Timestamp of latest device swap performed. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z)
          nullable: true
          example: '2023-07-03T14:27:08.312+02:00'
        monitoredPeriod:
          type: integer
          description: >-
            Timeframe in days for device change supervision for the phone number. It could be valued in the response if the latest Device swap occurred before this monitored period.
          example: 120
    CreateDeviceSwapDate-DSWAP-V1:
      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber-DSWAP-V1'
    CreateCheckDeviceSwap-DSWAP-V1:
      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber-DSWAP-V1'
        maxAge:
          type: integer
          example: 240
          description: |
            Period in hours to be checked for device swap.
          format: int32
          minimum: 1
          maximum: 2400
          default: 240
    PhoneNumber-DSWAP-V1:
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: '+34666111333'
      description: >-
        A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
    CheckDeviceSwapInfo-DSWAP-V1:
      type: object
      required:
        - swapped
      properties:
        swapped:
          type: boolean
          description: >-
            Indicates whether the device has been swapped during the period within the provided age.
    ErrorInfo-DSWAP-V1:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          description: HTTP response status code
        code:
          type: string
          description: Code given to this error
        message:
          type: string
          description: Detailed error description
    SessionId-QoD-V0:
      description: Session ID in UUID format
      type: string
      format: uuid
    BaseSessionInfo-QoD-V0:
      description: Common attributes of a QoD session
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device-QoD-V0'
        applicationServer:
          $ref: '#/components/schemas/ApplicationServer-QoD-V0'
        devicePorts:
          description: >-
            The ports used locally by the device for flows to which the requested QoS profile should apply. If omitted, then the qosProfile will apply to all flows between the device and the specified application server address and ports
          allOf:
            - $ref: '#/components/schemas/PortsSpec-QoD-V0'
        applicationServerPorts:
          description: A list of single ports or port ranges on the application server
          allOf:
            - $ref: '#/components/schemas/PortsSpec-QoD-V0'
        qosProfile:
          $ref: '#/components/schemas/QosProfileName-QoD-V0'
        webhook:
          type: object
          required:
            - notificationUrl
          properties:
            notificationUrl:
              type: string
              format: uri
              example: 'https://application-server.com'
              description: Allows asynchronous delivery of session related events
            notificationAuthToken:
              type: string
              minLength: 20
              maxLength: 256
              example: c8974e592c2fa383d4a3960714
              description: Authentication token for callback API
      required:
        - device
        - applicationServer
        - qosProfile
    SessionInfo-QoD-V0:
      description: Session related information.
      allOf:
        - $ref: '#/components/schemas/BaseSessionInfo-QoD-V0'
        - type: object
          properties:
            sessionId:
              $ref: '#/components/schemas/SessionId-QoD-V0'
            duration:
              type: integer
              format: int32
              minimum: 1
              example: 86400
            startedAt:
              type: integer
              example: 1639479600
              description: Timestamp of session start in seconds since Unix epoch
              format: int64
            expiresAt:
              type: integer
              example: 1639566000
              description: >-
                Timestamp of session expiration if the session was not deleted, in seconds since Unix epoch
              format: int64
            qosStatus:
              $ref: '#/components/schemas/QosStatus-QoD-V0'
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message-QoD-V0'
          required:
            - sessionId
            - duration
            - startedAt
            - expiresAt
            - qosStatus
    CreateSession-QoD-V0:
      description: Attributes required to create a session
      allOf:
        - $ref: '#/components/schemas/BaseSessionInfo-QoD-V0'
        - type: object
          properties:
            duration:
              description: >
                Session duration in seconds. Maximal value of 24 hours is used if not set.

                After session is expired the, client will receive a `QOS_STATUS_CHANGED` event with

                - `qosStatus` as `UNAVAILABLE`, and,

                - `statusInfo` as `DURATION_EXPIRED`.

                See notification callback.

              type: integer
              format: int32
              minimum: 1
              maximum: 86400
              default: 86400
              example: 86400
    Port-QoD-V0:
      description: TCP or UDP port number
      type: integer
      minimum: 0
      maximum: 65535
    ValidationError-QoD-V0:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    HTTPValidationError-QoD-V0:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError-QoD-V0'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PortsSpec-QoD-V0:
      type: object
      minProperties: 1
      properties:
        ranges:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - from
              - to
            properties:
              from:
                $ref: '#/components/schemas/Port-QoD-V0'
              to:
                $ref: '#/components/schemas/Port-QoD-V0'
        ports:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Port-QoD-V0'
      example:
        ranges:
          - from: 5010
            to: 5020
        ports:
          - 5060
          - 5070
    ExtendSessionDuration-QoD-V0:
      description: Attributes required to extend the duration of an active session
      type: object
      properties:
        requestedAdditionalDuration:
          description: |
            Additional duration in seconds to be extended.
          type: integer
          format: int32
          minimum: 1
          maximum: 86399
          example: 60
      required:
        - requestedAdditionalDuration
    QosProfile-QoD-V0:
      description: |
        Data type with attributes of a QosProfile
      type: object
      properties:
        name:
          $ref: '#/components/schemas/QosProfileName-QoD-V0'
        description:
          description: |
            A description of the QoS profile.
          type: string
          example: QoS profile for video streaming
        status:
          $ref: '#/components/schemas/QosProfileStatusEnum-QoD-V0'
        targetMinUpstreamRate:
          description: >
            This is the target minimum upstream rate for the QoS profile.

            For 5G networks 3GPP Guaranteed Bit Rate (GBR) refers to a dedicated, fixed data rate assigned to

            specific services, ensuring a minimum performance level. As per 3GPP TS 23.203,

            GBR is a QoS parameter used to manage traffic classes in mobile networks. It

            provides a stable data rate for latency-sensitive applications, such as voice calls or

            video streaming, helping maintain a consistent user experience. When this attribute is set

            this could imply that a GBR QCI is used, though mechanisms on the network can be used to

            ensure a minimum performance level without using a GBR QCI.

            The committed data rate allocated to specific services, ensuring a consistent level of

            performance. For DOCSIS networks, the "Minimum Reserved Traffic Rate" is defined in the

            DOCSIS 3.1 - MAC and Upper Layer Protocols Interface Specification"

            and it ensures a consistent level of performance for specific services within the network.

          allOf:
            - $ref: '#/components/schemas/Rate-QoD-V0'
        maxUpstreamRate:
          description: |
            The maximum best effort data
          allOf:
            - $ref: '#/components/schemas/Rate-QoD-V0'
        maxUpstreamBurstRate:
          description: >
            When defined, this is the maximum upstream burst rate for the QoS profile, that will enable

            the network to burst data at a higher rate than the maxUpstreamRate for a period of time.

          allOf:
            - $ref: '#/components/schemas/Rate-QoD-V0'
        targetMinDownstreamRate:
          description: >
            This is the target minimum downstream rate for the QoS profile.

            For 5G networks 3GPP Guaranteed Bit Rate (GBR) refers to a dedicated, fixed data rate assigned to

            specific services, ensuring a minimum performance level. As per 3GPP TS 23.203,

            GBR is a QoS parameter used to manage traffic classes in mobile networks. It

            provides a stable data rate for latency-sensitive applications, such as voice calls or

            video streaming, helping maintain a consistent user experience.  When this attribute is set

            this could imply that a GBR QCI is used, though mechanisms on the network can be used to

            ensure a minimum performance level without using a GBR QCI.

            The committed data rate allocated to specific services, ensuring a consistent level of

            performance. DOCSIS networks, the "Minimum Reserved Traffic Rate" is defined in the

            DOCSIS 3.1 - MAC and Upper Layer Protocols Interface Specification"

            and it ensures a consistent level of performance for specific services within the network.

          allOf:
            - $ref: '#/components/schemas/Rate-QoD-V0'
        maxDownstreamRate:
          description: |
            The maximum best effort rate
          allOf:
            - $ref: '#/components/schemas/Rate-QoD-V0'
        maxDownstreamBurstRate:
          description: >
            When defined, this is the maximum downstream burst rate for the QoS profile, that will enable

            the network to burst data at a higher rate than the maxDownstreamRate for a period of time.

            This can result in improved user experience when there is additional network capacity.

            For instance, when a user is streaming a video, the network can burst data at a higher rate

            to fill the buffer, and then return to the maxUpstreamRate once the buffer is full.

          allOf:
            - $ref: '#/components/schemas/Rate-QoD-V0'
        minDuration:
          description: |
            The shortest time period that this profile can be deployed.
          allOf:
            - $ref: '#/components/schemas/Duration-QoD-V0'
        maxDuration:
          description: >
            The maximum time period that this profile can be deployed.

            NOTE: currently the duration within `sessionInfo` is limited to 86400 seconds (1 day).

            The value of `maxDuration` shouldn't therefore exceed this time period. The limitation might be removed in later versions.

          allOf:
            - $ref: '#/components/schemas/Duration-QoD-V0'
        priority:
          type: integer
          example: 20
          description: >
            Priority levels allow efficient resource allocation and ensure optimal performance

            for various services in each technology, with the highest priority traffic receiving

            preferential treatment.

            The lower value the higher priority.

            Not all access networks use the same priority range, so this priority will be

            scaled to the access network's priority range.

          format: int32
          minimum: 1
          maximum: 100
        packetDelayBudget:
          description: >
            The packet delay budget is the maximum allowable one-way latency between the customer's device

            and the gateway from the operator's network to other networks. By limiting the delay, the network

            can provide an acceptable level of performance for various services, such as voice calls,

            video streaming, and data.

            The end-to-end or round trip latency will be about two times this value plus the latency not controlled

            by the operator

          allOf:
            - $ref: '#/components/schemas/Duration-QoD-V0'
        jitter:
          description: >
            The jitter requirement aims to limit the maximum variation in round-trip

            packet delay for the 99th percentile of traffic, following ITU Y.1540

            standards. It considers only acknowledged packets in a session, which are

            packets that receive a confirmation of receipt from the recipient (e.g.,

            using TCP). This requirement helps maintain consistent latency, essential

            for real-time applications such as VoIP, video calls, and gaming.

          allOf:
            - $ref: '#/components/schemas/Duration-QoD-V0'
        packetErrorLossRate:
          type: integer
          description: >
            The exponential power of the allowable error loss rate 10^(-N).

            For instance 3 would be an error loss rate of 10 to the power of -3 (0.001)


            For 5G network the 3GPP specification TS 23.203 defines the packet error loss rate QCI attribute. It

            describes the Quality of Service (QoS) Class Identifier (QCI) parameters used to

            differentiate traffic classes in mobile networks, ensuring appropriate resource

            allocation and performance for various services.


            The packet error loss rate is one of the QCI attributes, providing information on the

            acceptable packet loss rate for a specific traffic class. This attribute helps maintain

            the desired performance level for services like voice calls, video streaming, or data

            transfers within the 3GPP mobile network.

          format: int32
          minimum: 1
          maximum: 10
          example: 3
      required:
        - name
        - status
    QosProfileName-QoD-V0:
      description: >
        A unique name for identifying a specific QoS profile.

        This may follow different formats depending on the service providers implementation.

        Some options addresses:




          - A UUID style string
          - Support for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E
          - A searchable descriptive name
      type: string
      example: QCI_1_voice
      minLength: 3
      maxLength: 256
      format: string
      pattern: '^[a-zA-Z0-9_.-]+$'
    Rate-QoD-V0:
      type: object
      properties:
        value:
          type: integer
          example: 10
          format: int32
          minimum: 0
          maximum: 1024
        unit:
          $ref: '#/components/schemas/RateUnitEnum-QoD-V0'
    Duration-QoD-V0:
      type: object
      properties:
        value:
          type: integer
          example: 12
          format: int32
          minimum: 1
        unit:
          allOf:
            - $ref: '#/components/schemas/TimeUnitEnum-QoD-V0'
            - example: Minutes
    TimeUnitEnum-QoD-V0:
      type: string
      enum:
        - Days
        - Hours
        - Minutes
        - Seconds
        - Milliseconds
        - Microseconds
        - Nanoseconds
    QosProfileStatusEnum-QoD-V0:
      description: >
        The current status of the QoS Profile

        - `ACTIVE`- QoS Profile is available to be used

        - `INACTIVE`- QoS Profile is not currently available to be deployed

        - `DEPRECATED`- QoS profile is actively being used in a QoD session, but can not be deployed in new QoD sessions

      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - DEPRECATED
    RateUnitEnum-QoD-V0:
      type: string
      enum:
        - bps
        - kbps
        - Mbps
        - Gbps
        - Tbps
    CloudEvent-QoD-V0:
      description: Event compliant with the CloudEvents specification
      required:
        - id
        - source
        - specversion
        - type
        - time
      properties:
        id:
          description: 'Identifier of this event, that must be unique in the source context.'
          type: string
        source:
          description: >-
            Identifies the context in which an event happened in the specific Provider Implementation.
          type: string
          format: uri-reference
        type:
          description: The type of the event.
          type: string
          enum:
            - org.camaraproject.qod.v0.qos-status-changed
        specversion:
          description: >-
            Version of the specification to which this event conforms (must be 1.0 if it conforms to cloudevents 1.0.2 version)
          type: string
          enum:
            - '1.0'
        datacontenttype:
          description: >-
            media-type that describes the event payload encoding, must be "application/json" for CAMARA APIs
          type: string
          enum:
            - application/json
        data:
          description: 'Event notification details payload, which depends on the event type'
          type: object
        time:
          description: |
            Timestamp of when the occurrence happened. It must follow RFC 3339
          type: string
          format: date-time
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.qod.v0.qos-status-changed: '#/components/schemas/EventQosStatusChanged'
    EventQosStatusChanged-QoD-V0:
      allOf:
        - $ref: '#/components/schemas/CloudEvent-QoD-V0'
        - type: object
          properties:
            data:
              type: object
              description: Event details depending on the event type
              required:
                - sessionId
                - qosStatus
              properties:
                sessionId:
                  $ref: '#/components/schemas/SessionId-QoD-V0'
                qosStatus:
                  $ref: '#/components/schemas/EventQosStatus-QoD-V0'
                statusInfo:
                  $ref: '#/components/schemas/StatusInfo-QoD-V0'
          required:
            - data
    StatusInfo-QoD-V0:
      description: >
        Reason for the new `qosStatus`. Currently `statusInfo` is only applicable when `qosStatus` is 'UNAVAILABLE'.

        * `DURATION_EXPIRED` - Session terminated due to requested duration expired

        * `NETWORK_TERMINATED` - Network terminated the session before the requested duration expired

        * `DELETE_REQUESTED`- User requested the deletion of the session before the requested duration expired

      type: string
      enum:
        - DURATION_EXPIRED
        - NETWORK_TERMINATED
        - DELETE_REQUESTED
    Device-QoD-V0:
      description: >
        End-user equipment able to connect to a mobile network. Examples of devices include smartphones or IoT sensors/actuators.


        The developer can choose to provide the below specified device identifiers:


        * `ipv4Address`

        * `ipv6Address`

        * `phoneNumber`

        * `networkAccessIdentifier`


        NOTE: the MNO might support only a subset of these options. The API invoker can provide multiple identifiers to be compatible across different MNOs. In this case the identifiers MUST belong to the same device

      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber-QoD-V0'
        networkAccessIdentifier:
          $ref: '#/components/schemas/NetworkAccessIdentifier-QoD-V0'
        ipv4Address:
          $ref: '#/components/schemas/DeviceIpv4Addr-QoD-V0'
        ipv6Address:
          $ref: '#/components/schemas/DeviceIpv6Address-QoD-V0'
      minProperties: 1
    ApplicationServer-QoD-V0:
      description: >
        A server hosting backend applications to deliver some business logic to clients.


        The developer can choose to provide the below specified device identifiers:


        * `ipv4Address`

        * `ipv6Address`

      type: object
      properties:
        ipv4Address:
          $ref: '#/components/schemas/ApplicationServerIpv4Address-QoD-V0'
        ipv6Address:
          $ref: '#/components/schemas/ApplicationServerIpv6Address-QoD-V0'
      minProperties: 1
    NetworkAccessIdentifier-QoD-V0:
      description: >-
        A public identifier addressing a subscription in a mobile network. In 3GPP terminology, it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability ruling in force, and is individually managed by each operator.
      type: string
      example: 123456789@domain.com
    PhoneNumber-QoD-V0:
      description: >-
        A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, optionally prefixed with '+'.
      type: string
      pattern: '^\+?[0-9]{5,15}$'
      example: '123456789'
    DeviceIpv4Addr-QoD-V0:
      type: object
      description: >
        The device should be identified by either the public (observed) IP address and port as seen by the application server, or the private (local) and any public (observed) IP addresses in use by the device (this information can be obtained by various means, for example from some DNS servers).


        If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same address should be specified for both publicAddress and privateAddress.


        If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately by its allocated IPv6 address (field ipv6Address of the Device object)


        In all cases, publicAddress must be specified, along with at least one of either privateAddress or publicPort, dependent upon which is known. In general, mobile devices cannot be identified by their public IPv4 address alone.

      properties:
        publicAddress:
          $ref: '#/components/schemas/SingleIpv4Addr-QoD-V0'
        privateAddress:
          $ref: '#/components/schemas/SingleIpv4Addr-QoD-V0'
        publicPort:
          $ref: '#/components/schemas/Port-QoD-V0'
      anyOf:
        - required:
            - publicAddress
            - privateAddress
        - required:
            - publicAddress
            - publicPort
      example:
        publicAddress: 84.125.93.10
        publicPort: 59765
    SingleIpv4Addr-QoD-V0:
      description: A single IPv4 address with no subnet mask
      type: string
      format: ipv4
      example: 84.125.93.10
    DeviceIpv6Address-QoD-V0:
      description: >
        The device should be identified by the observed IPv6 address, or by any single IPv6 address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).


        The session shall apply to all IP flows between the device subnet and the specified application server, unless further restricted by the optional parameters devicePorts or applicationServerPorts.

      type: string
      format: ipv6
      example: '2001:db8:85a3:8d3:1319:8a2e:370:7344'
    ApplicationServerIpv4Address-QoD-V0:
      type: string
      example: 192.168.0.1/24
      description: |
        IPv4 address may be specified in form <address/mask> as:
          - address - an IPv4 number in dotted-quad form 1.2.3.4. Only this exact IP number will match the flow control rule.
          - address/mask - an IP number as above with a mask width of the form 1.2.3.4/24.
            In this case, all IP numbers from 1.2.3.0 to 1.2.3.255 will match. The bit width MUST be valid for the IP version.
    ApplicationServerIpv6Address-QoD-V0:
      type: string
      example: '2001:db8:85a3:8d3:1319:8a2e:370:7344'
      description: |
        IPv6 address may be specified in form <address/mask> as:
          - address - The /128 subnet is optional for single addresses:
            - 2001:db8:85a3:8d3:1319:8a2e:370:7344
            - 2001:db8:85a3:8d3:1319:8a2e:370:7344/128
          - address/mask - an IP v6 number with a mask:
            - 2001:db8:85a3:8d3::0/64
            - 2001:db8:85a3:8d3::/64
    Message-QoD-V0:
      type: object
      properties:
        severity:
          description: Message severity
          type: string
          enum:
            - INFO
            - WARNING
        description:
          description: Detailed message text
          type: string
      required:
        - severity
        - description
    QosStatus-QoD-V0:
      description: >
        The current status of the requested QoS session. The status can be one of the following:

        * `REQUESTED` - QoS has been requested by creating a session

        * `AVAILABLE` - The requested QoS has been provided by the network

        * `UNAVAILABLE` - The requested QoS cannot be provided by the network due to some reason

      type: string
      enum:
        - REQUESTED
        - AVAILABLE
        - UNAVAILABLE
    RetrieveSessionInput-QoD-V0:
      properties:
        device:
          $ref: '#/components/schemas/Device-QoD-V0'
      type: object
      required:
        - device
      title: RetrieveSessionInput
    EventQosStatus-QoD-V0:
      description: >
        The current status of a requested or previously available session. Applicable values in the event are:

        *  `AVAILABLE` - The requested QoS has been provided by the network.

        *  `UNAVAILABLE` - A requested or previously available QoS session is now unavailable. `statusInfo` may provide additional information about the reason for the unavailability.

      type: string
      enum:
        - AVAILABLE
        - UNAVAILABLE
    ErrorInfo-QoD-V0:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code returned along with this error response
        code:
          type: string
          description: Code given to this error
        message:
          type: string
          description: Detailed error description
      required:
        - status
        - code
        - message
    SessionId-QoD-V1:
      description: Session ID in UUID format
      type: string
      format: uuid
    BaseSessionInfo-QoD-V1:
      description: Common attributes of a QoD session
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device-QoD-V1'
        applicationServer:
          $ref: '#/components/schemas/ApplicationServer-QoD-V1'
        devicePorts:
          description: >-
            The ports used locally by the device for flows to which the requested QoS profile should apply. If omitted, then the qosProfile will apply to all flows between the device and the specified application server address and ports
          allOf:
            - $ref: '#/components/schemas/PortsSpec-QoD-V1'
        applicationServerPorts:
          description: A list of single ports or port ranges on the application server
          allOf:
            - $ref: '#/components/schemas/PortsSpec-QoD-V1'
        qosProfile:
          $ref: '#/components/schemas/QosProfileName-QoD-V1'
        sink:
          type: string
          format: uri
          description: >-
            The address to which events about all status changes of the session (e.g. session termination) shall be delivered using the selected protocol.
          example: 'https://endpoint.example.com/sink'
        sinkCredential:
          description: >-
            A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
          allOf:
            - $ref: '#/components/schemas/SinkCredential-QoD-V1'
      required:
        - applicationServer
        - qosProfile
    SessionInfo-QoD-V1:
      description: Session related information.
      allOf:
        - $ref: '#/components/schemas/BaseSessionInfo-QoD-V1'
        - type: object
          properties:
            sessionId:
              $ref: '#/components/schemas/SessionId-QoD-V1'
            duration:
              type: integer
              format: int32
              minimum: 1
              example: 86400
            startedAt:
              type: integer
              example: 1639479600
              description: Timestamp of session start in seconds since Unix epoch
              format: int64
            expiresAt:
              type: integer
              example: 1639566000
              description: >-
                Timestamp of session expiration if the session was not deleted, in seconds since Unix epoch
              format: int64
            qosStatus:
              $ref: '#/components/schemas/QosStatus-QoD-V1'
            statusInfo:
              $ref: '#/components/schemas/StatusInfo-QoD-V1'
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message-QoD-V1'
          required:
            - sessionId
            - duration
            - startedAt
            - expiresAt
            - qosStatus
    CreateSession-QoD-V1:
      description: Attributes required to create a session
      allOf:
        - $ref: '#/components/schemas/BaseSessionInfo-QoD-V1'
        - type: object
          properties:
            duration:
              description: >
                Session duration in seconds. Maximal value of 24 hours is used if not set.

                After session is expired the, client will receive a `QOS_STATUS_CHANGED` event with

                - `qosStatus` as `UNAVAILABLE`, and,

                - `statusInfo` as `DURATION_EXPIRED`.

                See notification callback.

              type: integer
              format: int32
              minimum: 1
              maximum: 86400
              default: 86400
              example: 86400
    Port-QoD-V1:
      description: TCP or UDP port number
      type: integer
      minimum: 0
      maximum: 65535
    ValidationError-QoD-V1:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    HTTPValidationError-QoD-V1:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError-QoD-V1'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PortsSpec-QoD-V1:
      type: object
      minProperties: 1
      properties:
        ranges:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - from
              - to
            properties:
              from:
                $ref: '#/components/schemas/Port-QoD-V1'
              to:
                $ref: '#/components/schemas/Port-QoD-V1'
        ports:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Port-QoD-V1'
      example:
        ranges:
          - from: 5010
            to: 5020
        ports:
          - 5060
          - 5070
    SinkCredential-QoD-V1:
      type: object
      properties:
        credentialType:
          type: string
          enum:
            - ACCESSTOKEN
          description: |
            The type of the credential.
            Note: Type of the credential - MUST be set to ACCESSTOKEN for now
      discriminator:
        propertyName: credentialType
        mapping:
          ACCESSTOKEN: '#/components/schemas/AccessTokenCredential'
      required:
        - credentialType
    AccessTokenCredential-QoD-V1:
      type: object
      description: An access token credential.
      allOf:
        - $ref: '#/components/schemas/SinkCredential-QoD-V1'
        - type: object
          properties:
            accessToken:
              description: >-
                REQUIRED. An access token is a previously acquired token granting access to the target resource.
              type: string
            accessTokenExpiresUtc:
              type: string
              format: date-time
              description: >
                REQUIRED. An absolute (UTC) timestamp at which the token shall be considered expired. Token expiration should occur

                after the termination of the requested session, allowing the client to be notified of any changes during the

                sessions's existence. If the token expires while the session is still active, the client will stop receiving notifications.

                If the access token is a JWT and registered "exp" (Expiration Time) claim is present, the two expiry times should match.

                It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.

                Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z)

              example: '2023-07-03T12:27:08.312Z'
            accessTokenType:
              description: >-
                REQUIRED. Type of the access token (See [OAuth 2.0](https://tools.ietf.org/html/rfc6749#section-7.1)). For the current version of the API the type MUST be set to `Bearer`.
              type: string
              enum:
                - bearer
          required:
            - accessToken
            - accessTokenExpiresUtc
            - accessTokenType
    ExtendSessionDuration-QoD-V1:
      description: Attributes required to extend the duration of an active session
      type: object
      properties:
        requestedAdditionalDuration:
          description: |
            Additional duration in seconds to be extended.
          type: integer
          format: int32
          minimum: 1
          maximum: 86399
          example: 60
      required:
        - requestedAdditionalDuration
    QosProfileName-QoD-V1:
      description: >
        A unique name for identifying a specific QoS profile.

        This may follow different formats depending on the service providers implementation.

        Some options addresses:




          - A UUID style string
          - Support for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E
          - A searchable descriptive name
      type: string
      example: QCI_1_voice
      minLength: 3
      maxLength: 256
      format: string
      pattern: '^[a-zA-Z0-9_.-]+$'
    CloudEvent-QoD-V1:
      description: Event compliant with the CloudEvents specification
      required:
        - id
        - source
        - specversion
        - type
        - time
      properties:
        id:
          description: 'Identifier of this event, that must be unique in the source context.'
          type: string
        source:
          description: >-
            Identifies the context in which an event happened in the specific Provider Implementation.
          type: string
          format: uri-reference
        type:
          description: The type of the event.
          type: string
          enum:
            - org.camaraproject.quality-on-demand.v1.qos-status-changed
        specversion:
          description: >-
            Version of the specification to which this event conforms (must be 1.0 if it conforms to cloudevents 1.0.2 version)
          type: string
          enum:
            - '1.0'
        datacontenttype:
          description: >-
            media-type that describes the event payload encoding, must be "application/json" for CAMARA APIs
          type: string
          enum:
            - application/json
        data:
          description: 'Event notification details payload, which depends on the event type'
          type: object
        time:
          description: |
            Timestamp of when the occurrence happened. It must follow RFC 3339
          type: string
          format: date-time
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.quality-on-demand.v1.qos-status-changed: '#/components/schemas/EventQosStatusChanged'
    EventQosStatusChanged-QoD-V1:
      allOf:
        - $ref: '#/components/schemas/CloudEvent-QoD-V1'
        - type: object
          properties:
            data:
              type: object
              description: Event details depending on the event type
              required:
                - sessionId
                - qosStatus
              properties:
                sessionId:
                  $ref: '#/components/schemas/SessionId-QoD-V1'
                qosStatus:
                  $ref: '#/components/schemas/EventQosStatus-QoD-V1'
                statusInfo:
                  $ref: '#/components/schemas/StatusInfo-QoD-V1'
          required:
            - data
    StatusInfo-QoD-V1:
      description: >
        Reason for the new `qosStatus`. Currently `statusInfo` is only applicable when `qosStatus` is 'UNAVAILABLE'.

        * `DURATION_EXPIRED` - Session terminated due to requested duration expired

        * `NETWORK_TERMINATED` - Network terminated the session before the requested duration expired

        * `DELETE_REQUESTED`- User requested the deletion of the session before the requested duration expired

      type: string
      enum:
        - DURATION_EXPIRED
        - NETWORK_TERMINATED
        - DELETE_REQUESTED
    Device-QoD-V1:
      description: >
        End-user equipment able to connect to a network. Examples of devices include smartphones or IoT sensors/actuators.


        The developer can choose to provide the below specified device identifiers:


        * `ipv4Address`

        * `ipv6Address`

        * `phoneNumber`

        * `networkAccessIdentifier`


        NOTE: the MNO might support only a subset of these options. The API invoker can provide multiple identifiers to be compatible across different MNOs. In this case the identifiers MUST belong to the same device

      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber-QoD-V1'
        networkAccessIdentifier:
          $ref: '#/components/schemas/NetworkAccessIdentifier-QoD-V1'
        ipv4Address:
          $ref: '#/components/schemas/DeviceIpv4Addr-QoD-V1'
        ipv6Address:
          $ref: '#/components/schemas/DeviceIpv6Address-QoD-V1'
      minProperties: 1
    ApplicationServer-QoD-V1:
      description: >
        A server hosting backend applications to deliver some business logic to clients.


        The developer can choose to provide the below specified device identifiers:


        * `ipv4Address`

        * `ipv6Address`

      type: object
      properties:
        ipv4Address:
          $ref: '#/components/schemas/ApplicationServerIpv4Address-QoD-V1'
        ipv6Address:
          $ref: '#/components/schemas/ApplicationServerIpv6Address-QoD-V1'
      minProperties: 1
    NetworkAccessIdentifier-QoD-V1:
      description: >-
        A public identifier addressing a subscription in a mobile network. In 3GPP terminology, it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability ruling in force, and is individually managed by each operator.
      type: string
      example: 123456789@domain.com
    PhoneNumber-QoD-V1:
      description: >-
        A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
      type: string
      pattern: '^\+?[0-9]{5,15}$'
      example: '+123456789'
    DeviceIpv4Addr-QoD-V1:
      type: object
      description: >
        The device should be identified by either the public (observed) IP address and port as seen by the application server, or the private (local) and any public (observed) IP addresses in use by the device (this information can be obtained by various means, for example from some DNS servers).


        If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same address should be specified for both publicAddress and privateAddress.


        If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately by its allocated IPv6 address (field ipv6Address of the Device object)


        In all cases, publicAddress must be specified, along with at least one of either privateAddress or publicPort, dependent upon which is known. In general, mobile devices cannot be identified by their public IPv4 address alone.

      properties:
        publicAddress:
          $ref: '#/components/schemas/SingleIpv4Addr-QoD-V1'
        privateAddress:
          $ref: '#/components/schemas/SingleIpv4Addr-QoD-V1'
        publicPort:
          $ref: '#/components/schemas/Port-QoD-V1'
      anyOf:
        - required:
            - publicAddress
            - privateAddress
        - required:
            - publicAddress
            - publicPort
      example:
        publicAddress: 84.125.93.10
        publicPort: 59765
    SingleIpv4Addr-QoD-V1:
      description: A single IPv4 address with no subnet mask
      type: string
      format: ipv4
      example: 84.125.93.10
    DeviceIpv6Address-QoD-V1:
      description: >
        The device should be identified by the observed IPv6 address, or by any single IPv6 address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).


        The session shall apply to all IP flows between the device subnet and the specified application server, unless further restricted by the optional parameters devicePorts or applicationServerPorts.

      type: string
      format: ipv6
      example: '2001:db8:85a3:8d3:1319:8a2e:370:7344'
    ApplicationServerIpv4Address-QoD-V1:
      type: string
      example: 192.168.0.1/24
      description: |
        IPv4 address may be specified in form <address/mask> as:
          - address - an IPv4 number in dotted-quad form 1.2.3.4. Only this exact IP number will match the flow control rule.
          - address/mask - an IP number as above with a mask width of the form 1.2.3.4/24.
            In this case, all IP numbers from 1.2.3.0 to 1.2.3.255 will match. The bit width MUST be valid for the IP version.
    ApplicationServerIpv6Address-QoD-V1:
      type: string
      example: '2001:db8:85a3:8d3:1319:8a2e:370:7344'
      description: |
        IPv6 address may be specified in form <address/mask> as:
          - address - The /128 subnet is optional for single addresses:
            - 2001:db8:85a3:8d3:1319:8a2e:370:7344
            - 2001:db8:85a3:8d3:1319:8a2e:370:7344/128
          - address/mask - an IP v6 number with a mask:
            - 2001:db8:85a3:8d3::0/64
            - 2001:db8:85a3:8d3::/64
    Message-QoD-V1:
      type: object
      properties:
        severity:
          description: Message severity
          type: string
          enum:
            - INFO
            - WARNING
        description:
          description: Detailed message text
          type: string
      required:
        - severity
        - description
    QosStatus-QoD-V1:
      description: >
        The current status of the requested QoS session. The status can be one of the following:

        * `REQUESTED` - QoS has been requested by creating a session

        * `AVAILABLE` - The requested QoS has been provided by the network

        * `UNAVAILABLE` - The requested QoS cannot be provided by the network due to some reason

      type: string
      enum:
        - REQUESTED
        - AVAILABLE
        - UNAVAILABLE
    RetrieveSessionInput-QoD-V1:
      properties:
        device:
          $ref: '#/components/schemas/Device-QoD-V1'
      type: object
      required:
        - device
      title: RetrieveSessionInput
    RetrieveSessionsOutput-QoD-V1:
      description: QoS session information for a given device
      type: array
      items:
        $ref: '#/components/schemas/SessionInfo-QoD-V1'
      minItems: 0
    EventQosStatus-QoD-V1:
      description: >
        The current status of a requested or previously available session. Applicable values in the event are:

        *  `AVAILABLE` - The requested QoS has been provided by the network.

        *  `UNAVAILABLE` - A requested or previously available QoS session is now unavailable. `statusInfo` may provide additional information about the reason for the unavailability.

      type: string
      enum:
        - AVAILABLE
        - UNAVAILABLE
    ErrorInfo-QoD-V1:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code returned along with this error response
        code:
          type: string
          description: Code given to this error
        message:
          type: string
          description: Detailed error description
      required:
        - status
        - code
        - message
    UnconditionalCallForwardingSignal-Cfs-V0:
      description: >-
        resource containing the information about the Unconditional Call Forwarding Service for the given phone number (PhoneNumber)
      type: object
      properties:
        active:
          type: boolean
          description: Indicates if the unconditional call forwarding service is active.
    CallForwardingSignal-Cfs-V0:
      description: >-
        resource containing the list of the Call Forwarding Services active for the given phone number (PhoneNumber). The possible states are, 'inactive' (no call forwarding service activated), 'unconditional' (call forwarded independently from the device status), 'conditional_busy' (call forwarded if the device is on an active call), 'conditional_not_reachable' (call forwarded if the device is not reachable), 'conditional_no_answer' (call forwarded if the device doesn't answer the incoming call).
      type: array
      items:
        type: string
        enum:
          - inactive
          - unconditional
          - conditional_busy
          - conditional_not_reachable
          - conditional_no_answer
      example:
        - unconditional
        - conditional_busy
        - conditional_no_answer
      minItems: 1
    CreateCallForwardingSignal-Cfs-V0:
      description: >-
        resource containing the phone number (PhoneNumber) regarding which the Call Forwarding Service must be checked. To be valorised only in case of two-legged authentication. If valorised with three-legged authentication a 422-UNNECESSARY_IDENTIFIER error code is returned.
      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber-Cfs-V0'
    PhoneNumber-Cfs-V0:
      description: >-
        A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: '+99999991000'
    ErrorInfo-Cfs-V0:
      description: error info template
      type: object
      required:
        - message
        - status
        - code
      properties:
        message:
          type: string
          description: A human readable description of what the event represent
        status:
          type: integer
          description: HTTP response status code
        code:
          type: string
          description: Friendly Code to describe the error
    XCorrelator-ConsentInfo-V0:
      description: Value for the x-correlator
      type: string
      pattern: '^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$'
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    PhoneNumber-ConsentInfo-V0:
      type: string
      description: >-
        A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: '+123456789'
    RetrieveStatusRequestBody-ConsentInfo-V0:
      type: object
      description: >
        The request body for the retrieve status request. It contains the requested scope(s), the Purpose for which the API Consumer intends to process the User's personal data, a flag indicating whether the API Consumer requests a Consent capture URL and optionally the phone number of the User. The phone number is required when the API is invoked using a two-legged access token, but MUST NOT be provided when a three-legged access token is used, as the subject will be uniquely identified from the access token.

      required:
        - scopes
        - purpose
        - requestCaptureUrl
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber-ConsentInfo-V0'
        scopes:
          $ref: '#/components/schemas/Scopes-ConsentInfo-V0'
        purpose:
          $ref: '#/components/schemas/Purpose-ConsentInfo-V0'
        requestCaptureUrl:
          type: boolean
          description: >
            A boolean flag indicating whether the API Consumer requests API Provider to return a Consent capture URL.

            * `true` - If set to `true` the API will include a `captureUrl` in the response body if applicable.

            * `false` - The API will omit the Consent capture URL from the response.

          example: true
    Scopes-ConsentInfo-V0:
      type: array
      minItems: 1
      items:
        type: string
      description: >
        List of requested scopes. The scope is a string that represents the access rights that the API Consumer is requesting from the User.

      example:
        - 'location-verification:verify'
    Purpose-ConsentInfo-V0:
      type: string
      pattern: '^dpv:[a-zA-Z0-9]+$'
      description: >
        The reason for which personal data will be processed by the API Consumer. CAMARA defines a standard set of Purposes which can be used by API Consumers to specify the reason for their intended personal data processing. CAMARA uses the [W3C Data Privacy Vocabulary](https://w3c.github.io/dpv/2.0/dpv/) (DPV) to represent these purposes e.g. `dpv:FraudPreventionAndDetection` or `dpv:RequestedServiceProvision`.

      example: 'dpv:FraudPreventionAndDetection'
    RetrieveStatusResponseBody-ConsentInfo-V0:
      type: object
      required:
        - statusInfo
      properties:
        statusInfo:
          $ref: '#/components/schemas/statusInfo-ConsentInfo-V0'
        captureUrl:
          type: string
          format: url
          description: >
            URL where the User can provide the necessary Consent. This field is only present in the API response if the API Consumer requests it and if the following conditions are met:


            - `statusInfo[*].statusValidForProcessing` is `false`, and

            - `statusInfo[*].statusReason` is `PENDING`, `REQUESTED` or `EXPIRED`.


            Please note that this field is only applicable when the User Consent is required to enable valid data processing. A unique URL is provided to authorise all items in the statusInfo list that require user action.

          example: 'https://example.org/consent-capture-url'
    statusInfo-ConsentInfo-V0:
      type: array
      description: >
        Provides information about the validity status of the requested data processing for the specified scope(s) and Purpose. It contains details of whether the processing of the data is currently valid and, if not, the reason why. The expiration date of the validity may be also provided if applicable.


        More than one array item may be required for the requested scope(s) and Purpose, e.g. when the requested scopes relate to multiple APIs.

      items:
        $ref: '#/components/schemas/statusInfoObject-ConsentInfo-V0'
      minItems: 1
    statusInfoObject-ConsentInfo-V0:
      type: object
      required:
        - scopes
        - purpose
        - statusValidForProcessing
      properties:
        scopes:
          $ref: '#/components/schemas/Scopes-ConsentInfo-V0'
        purpose:
          $ref: '#/components/schemas/Purpose-ConsentInfo-V0'
        statusValidForProcessing:
          type: boolean
          description: >
            Boolean flag that shows the validity status of the requested data processing for the specified scope(s) and Purpose.

            * `true` - indicates that the current status is valid and permits the requested data processing.

            * `false` - indicates that the requested data processing is not permitted. The reason for this is provided in the `statusReason` field.

        statusReason:
          type: string
          enum:
            - PENDING
            - REQUESTED
            - REVOKED
            - EXPIRED
            - OBJECTED
          description: >
            This field must be present if `statusValidForProcessing` is `false`. It indicates the reason why the requested data processing is not permitted for the specified scope(s) and Purpose. It provides API Consumers with additional context on the current validity status, helping them to understand its applicability and the next steps they may need to take.


            It is particularly useful for determining whether the API Consumer should prompt the User to take action, such as providing Consent or renewing an existing Consent.


            Possible values are:


            - `PENDING`: The requested data processing has not yet been established or fully validated under the applicable privacy regulations.




                        For example, the User has not yet provided Consent when it is required.
            - `REQUESTED`: The permission for the requested data processing has been submitted but has not yet been granted or confirmed.




                        This is common when the API Consumer has initiated a request for Consent capture, but the User has not yet completed the process. For example, this occurs when a notice prompting the User to provide Consent has been displayed, but they have not yet made a decision.
            - `REVOKED`: The User has actively withdrawn their permission for the requested data processing after previously opting in.




                        For example, the User revokes their Consent for the data processing.
            - `OBJECTED`: The user has opted out of the requested data processing, despite a previous explicit opt-in not being required.




                        This is common when the User has exercised their right to object to data processing under the applicable privacy regulations.
            - `EXPIRED`: When applicable, the validity of the data processing has ceased due to the passage of time or a pre-defined condition.




                        This is common for time-limited Consents.
        expirationDate:
          type: string
          format: date-time
          description: >
            The date and time at which the validity of the data processing is set to expire or has expired.

            It applies mainly to time-limited Consents, or other cases where a specific duration of validity is defined for the data processing. This field is only applicable:


            - if `statusValidForProcessing` is `true` (indicating a future expiration), or

            - if `statusValidForProcessing` is `false` and `statusReason` is `EXPIRED` (indicating the past expiration date).


            It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone. Recommended format is yyyy-MM-dd'T'HH:mm:ss.SSSZ (i.e. which allows 2023-07-03T14:27:08.312+02:00 or 2023-07-03T12:27:08.312Z).

          example: '2023-07-03T14:27:08.312+02:00'
