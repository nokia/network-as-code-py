  /passthrough/camara/v1/number-verification/number-verification/v0/verify:
    post:
      tags:
        - Number Verification v1.0.0
        - Phone number share
      summary: >-
        Verifies if the received hashed/plain text phone number matches the phone number associated with the access token
      description: >
        Verifies if the specified phone number (either in plain text or hashed format) matches the one that the user is currently using. Only one of the plain or hashed formats must be provided.

        - The number verification will be done for the user that has authenticated via mobile network

        - It returns true/false depending on if the hashed phone number received as input matches the authenticated user's `device phone number` associated to the access token

      operationId: phoneNumberVerify
      parameters:
        - in: header
          name: x-correlator
          required: false
          description: Correlation id for the different services
          schema:
            type: string
        - in: header
          name: authorization
          required: false
          description: authorization header for token
          schema:
            type: string
        - in: query
          name: code
          required: false
          description: Authorization code received from the CSP
          schema:
            type: string
        - in: query
          name: state
          required: false
          description: Application state
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberVerificationRequestBody-NV-V1'
            examples:
              NUMBER_VERIFY_TRUE_PHONE_NUMBER:
                value:
                  phoneNumber: '+99999991000'
              NUMBER_VERIFY_FALSE_PHONE_NUMBER:
                value:
                  phoneNumber: '+99999991001'
        required: true
      responses:
        '200':
          description: OK
          headers:
            x-correlator:
              description: Correlation id for the different services
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberVerificationMatchResponse-NV-V1'
        '400':
          $ref: '#/components/responses/Generic400-NV-V1'
        '401':
