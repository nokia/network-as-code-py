          description: The HTTP method to use for sending the message.
          enum:
            - POST
    MQTTSubscriptionRequest-Geo-V0:
      allOf:
        - $ref: '#/components/schemas/SubscriptionRequest-Geo-V0'
        - type: object
          properties:
            protocolSettings:
              $ref: '#/components/schemas/MQTTSettings-Geo-V0'
    MQTTSubscriptionResponse-Geo-V0:
      allOf:
        - $ref: '#/components/schemas/Subscription-Geo-V0'
        - type: object
          properties:
            protocolSettings:
              $ref: '#/components/schemas/MQTTSettings-Geo-V0'
    MQTTSettings-Geo-V0:
      type: object
      properties:
        topicName:
          type: string
        qos:
          type: integer
          format: int32
        retain:
          type: boolean
        expiry:
          type: integer
          format: int32
        userProperties:
          type: object
      required:
