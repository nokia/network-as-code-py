components:
  schemas:
    ErrorInfo-Geo-V0:
      description: The error info object for possible error cases
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          description: HTTP response status code
        code:
          type: string
          description: Code given to this error
        message:
          type: string
          description: Detailed error description
    SubscriptionRequest-Geo-V0:
      description: The request for creating a event-type event subscription
      type: object
      required:
        - sink
        - protocol
        - config
        - types
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol-Geo-V0'
        sink:
          type: string
          format: url
          description: >-
            The address to which events shall be delivered using the selected protocol.
          example: 'https://endpoint.example.com/sink'
        sinkCredential:
          allOf:
            - description: >-
                A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
            - $ref: '#/components/schemas/SinkCredential-Geo-V0'
        types:
          description: |
            Camara Event types eligible to be delivered by this subscription.
            Note: As of now we enforce to have only event type per subscription.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/SubscriptionEventType-Geo-V0'
        config:
          $ref: '#/components/schemas/Config-Geo-V0'
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: '#/components/schemas/HTTPSubscriptionRequest'
          MQTT3: '#/components/schemas/MQTTSubscriptionRequest'
          MQTT5: '#/components/schemas/MQTTSubscriptionRequest'
          AMQP: '#/components/schemas/AMQPSubscriptionRequest'
          NATS: '#/components/schemas/NATSSubscriptionRequest'
          KAFKA: '#/components/schemas/ApacheKafkaSubscriptionRequest'
    Protocol-Geo-V0:
      type: string
      enum:
        - HTTP
        - MQTT3
        - MQTT5
        - AMQP
        - NATS
        - KAFKA
      description: Identifier of a delivery protocol. Only HTTP is allowed for now
      example: HTTP
    Config-Geo-V0:
      description: >
        Implementation-specific configuration parameters needed by the subscription manager for acquiring events.

        In CAMARA we have predefined attributes like `subscriptionExpireTime`, `subscriptionMaxEvents`, `initialEvent`

        Specific event type attributes must be defined in `subscriptionDetail`

        Note: if a request is performed for several event type, all subscribed event will use same `config` parameters.

      type: object
      required:
        - subscriptionDetail
      properties:
        subscriptionDetail:
          $ref: '#/components/schemas/SubscriptionDetail-Geo-V0'
        subscriptionExpireTime:
          type: string
          format: date-time
          example: '2023-01-17T13:18:23.682Z'
          description: >-
            The subscription expiration time (in date-time format) requested by the API consumer.
        subscriptionMaxEvents:
          type: integer
          description: >-
            Identifies the maximum number of event reports to be generated (>=1) requested by the API consumer - Once this number is reached, the subscription ends.
          minimum: 1
          example: 5
        initialEvent:
          type: boolean
          description: >
            Set to `true` by API consumer if consumer wants to get an event as soon as the subscription is created and current situation reflects event request.

            Example: Consumer request area entered event. If consumer sets initialEvent to true and device is already in the geofence, an event is triggered

    SinkCredential-Geo-V0:
      type: object
      properties:
        credentialType:
          type: string
          enum:
            - PLAIN
            - ACCESSTOKEN
            - REFRESHTOKEN
          description: The type of the credential.
      discriminator:
        propertyName: credentialType
        mapping:
          PLAIN: '#/components/schemas/PlainCredential'
          ACCESSTOKEN: '#/components/schemas/AccessTokenCredential'
          REFRESHTOKEN: '#/components/schemas/RefreshTokenCredential'
      required:
        - credentialType
    PlainCredential-Geo-V0:
      type: object
      description: A plain credential as a combination of an identifier and a secret.
      allOf:
        - $ref: '#/components/schemas/SinkCredential-Geo-V0'
        - type: object
          required:
            - identifier
            - secret
          properties:
            identifier:
              description: The identifier might be an account or username.
              type: string
            secret:
              description: The secret might be a password or passphrase.
              type: string
    AccessTokenCredential-Geo-V0:
      type: object
      description: An access token credential.
      allOf:
        - $ref: '#/components/schemas/SinkCredential-Geo-V0'
        - type: object
          properties:
            accessToken:
              description: >-
                REQUIRED. An access token is a previously acquired token granting access to the target resource.
              type: string
            accessTokenExpiresUtc:
              type: string
              format: date-time
              description: >-
                REQUIRED. An absolute UTC instant at which the token shall be considered expired.
            accessTokenType:
              description: >-
                REQUIRED. Type of the access token (See [OAuth 2.0](https://tools.ietf.org/html/rfc6749#section-7.1)).
              type: string
              enum:
                - bearer
          required:
            - accessToken
            - accessTokenExpiresUtc
            - accessTokenType
    RefreshTokenCredential-Geo-V0:
      type: object
      description: An access token credential with a refresh token.
      allOf:
        - $ref: '#/components/schemas/SinkCredential-Geo-V0'
        - type: object
          properties:
            accessToken:
              description: >-
                REQUIRED. An access token is a previously acquired token granting access to the target resource.
              type: string
            accessTokenExpiresUtc:
              type: string
              format: date-time
              description: >-
                REQUIRED. An absolute UTC instant at which the token shall be considered expired.
            accessTokenType:
              description: >-
                REQUIRED. Type of the access token (See [OAuth 2.0](https://tools.ietf.org/html/rfc6749#section-7.1)).
              type: string
              enum:
                - bearer
            refreshToken:
              description: >-
                REQUIRED. An refresh token credential used to acquire access tokens.
              type: string
            refreshTokenEndpoint:
              type: string
              format: uri
              description: >-
                REQUIRED. A URL at which the refresh token can be traded for an access token.
      required:
        - accessToken
        - accessTokenExpiresUtc
        - accessTokenType
        - refreshToken
        - refreshTokenEndpoint
    SubscriptionDetail-Geo-V0:
      description: The detail of the requested event subscription
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device-Geo-V0'
        area:
          $ref: '#/components/schemas/Area-Geo-V0'
      required:
        - device
        - area
    SubscriptionEventType-Geo-V0:
      type: string
      description: |
        area-entered - Event triggered when the device enters the given area

        area-left - Event triggered when the device leaves the given area
      enum:
        - org.camaraproject.geofencing-subscriptions.v0.area-entered
        - org.camaraproject.geofencing-subscriptions.v0.area-left
    NotificationEventType-Geo-V0:
      type: string
      description: |
        area-entered - Event triggered when the device enters the given area

        area-left - Event triggered when the device leaves the given area

        subscription-ends - Event triggered when the subscription ends
      enum:
        - org.camaraproject.geofencing-subscriptions.v0.area-entered
        - org.camaraproject.geofencing-subscriptions.v0.area-left
        - org.camaraproject.geofencing-subscriptions.v0.subscription-ends
    Subscription-Geo-V0:
      description: Represents a event-type subscription.
      type: object
      required:
        - sink
        - protocol
        - config
        - types
        - id
        - startsAt
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol-Geo-V0'
        sink:
          type: string
          format: url
          description: >-
            The address to which events shall be delivered using the selected protocol.
          example: 'https://endpoint.example.com/sink'
        sinkCredential:
          $ref: '#/components/schemas/SinkCredential-Geo-V0'
        types:
          description: |
            Camara Event types eligible to be delivered by this subscription.
          type: array
          items:
            type: string
        config:
          $ref: '#/components/schemas/Config-Geo-V0'
        id:
          type: string
          description: >-
            The unique identifier of the subscription in the scope of the subscription manager. When this information is contained within an event notification, this concept SHALL be referred as `subscriptionId` as per [Commonalities Event Notification Model](https://github.com/camaraproject/Commonalities/blob/main/documentation/API-design-guidelines.md#122-event-notification).
          example: '1119920371'
        startsAt:
          type: string
          format: date-time
          description: Date when the event subscription will begin/began
        expiresAt:
          type: string
          format: date-time
          description: >-
            Date when the event subscription will expire. Only provided when `subscriptionExpireTime` is indicated by API client or Telco Operator has specific policy about that.
        status:
          type: string
          description: >-
            Current status of the subscription - Management of Subscription State engine is not mandatory for now. Note not all statuses may be considered to be implemented. Details:




              - `ACTIVATION_REQUESTED`: Subscription creation (POST) is triggered but subscription creation process is not finished yet.
              - `ACTIVE`: Subscription creation process is completed. Subscription is fully operative.
              - `INACTIVE`: Subscription is temporarily inactive, but its workflow logic is not deleted.
              - `EXPIRED`: Subscription is ended (no longer active). This status applies when subscription is ended due to `SUBSCRIPTION_EXPIRED` or `ACCESS_TOKEN_EXPIRED` event.
              - `DELETED`: Subscription is ended as deleted (no longer active). This status applies when subscription information is kept (i.e. subscription workflow is no longer active but its meta-information is kept).
          enum:
            - ACTIVATION_REQUESTED
            - ACTIVE
            - EXPIRED
            - INACTIVE
            - DELETED
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: '#/components/schemas/HTTPSubscriptionResponse'
          MQTT3: '#/components/schemas/MQTTSubscriptionResponse'
          MQTT5: '#/components/schemas/MQTTSubscriptionResponse'
          AMQP: '#/components/schemas/AMQPSubscriptionResponse'
          NATS: '#/components/schemas/NATSSubscriptionResponse'
          KAFKA: '#/components/schemas/ApacheKafkaSubscriptionResponse'
    SubscriptionAsync-Geo-V0:
      description: >-
        Response for a event-type subscription request managed asynchronously (Creation or Deletion)
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SubscriptionId-Geo-V0'
    SubscriptionId-Geo-V0:
      type: string
      description: >-
        The unique identifier of the subscription in the scope of the subscription manager. When this information is contained within an event notification, this concept SHALL be referred as `subscriptionId` as per [Commonalities Event Notification Model](https://github.com/camaraproject/Commonalities/blob/main/documentation/API-design-guidelines.md#122-event-notification).
      example: qs15-h556-rt89-1298
    Device-Geo-V0:
      description: >
        End-user equipment able to connect to a mobile network. Examples of devices include smartphones or IoT sensors/actuators.


        The developer can choose to provide the below specified device identifiers:


        * `ipv4Address`

        * `ipv6Address`

        * `phoneNumber`

        * `networkAccessIdentifier`


        NOTE1: the MNO might support only a subset of these options. The API invoker can provide multiple identifiers to be compatible across different MNOs. In this case the identifiers MUST belong to the same device. When returned as part of a response, the device object must include the same identifier values that were provided originally. Please note that IP addresses of devices can change and get reused, so the original values may no longer identify the same device. They identified the device at the time of the subscription request.

        NOTE2: for the Commonalities release v0.4, we are enforcing that the networkAccessIdentifier is only part of the schema for future-proofing, and CAMARA does not currently allow its use. After the CAMARA meta-release work is concluded and the relevant issues are resolved, its use will need to be explicitly documented in the guidelines.

      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber-Geo-V0'
        networkAccessIdentifier:
          $ref: '#/components/schemas/NetworkAccessIdentifier-Geo-V0'
        ipv4Address:
          $ref: '#/components/schemas/DeviceIpv4Addr-Geo-V0'
        ipv6Address:
          $ref: '#/components/schemas/DeviceIpv6Address-Geo-V0'
      minProperties: 1
    PhoneNumber-Geo-V0:
      description: >-
        A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: '+123456789'
    NetworkAccessIdentifier-Geo-V0:
      description: >-
        A public identifier addressing a subscription in a mobile network. In 3GPP terminology, it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability ruling in force, and is individually managed by each operator.
      type: string
      example: 123456789@domain.com
    DeviceIpv4Addr-Geo-V0:
      type: object
      description: >
        The device should be identified by either the public (observed) IP address and port as seen by the application server, or the private (local) and any public (observed) IP addresses in use by the device (this information can be obtained by various means, for example from some DNS servers).


        If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same address should be specified for both publicAddress and privateAddress.


        If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately by its allocated IPv6 address (field ipv6Address of the Device object)


        In all cases, publicAddress must be specified, along with at least one of either privateAddress or publicPort, dependent upon which is known. In general, mobile devices cannot be identified by their public IPv4 address alone.

      properties:
        publicAddress:
          $ref: '#/components/schemas/SingleIpv4Addr-Geo-V0'
        privateAddress:
          $ref: '#/components/schemas/SingleIpv4Addr-Geo-V0'
        publicPort:
          $ref: '#/components/schemas/Port-Geo-V0'
      anyOf:
        - required:
            - publicAddress
            - privateAddress
        - required:
            - publicAddress
            - publicPort
      example:
        publicAddress: 84.125.93.10
        publicPort: 59765
    SingleIpv4Addr-Geo-V0:
      description: A single IPv4 address with no subnet mask
      type: string
      format: ipv4
      example: 84.125.93.10
    Port-Geo-V0:
      description: TCP or UDP port number
      type: integer
      minimum: 0
      maximum: 65535
    DeviceIpv6Address-Geo-V0:
      description: >
        The device should be identified by the observed IPv6 address, or by any single IPv6 address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).

      type: string
      format: ipv6
      example: '2001:db8:85a3:8d3:1319:8a2e:370:7344'
    Area-Geo-V0:
      type: object
      properties:
        areaType:
          $ref: '#/components/schemas/AreaType-Geo-V0'
      required:
        - areaType
      discriminator:
        propertyName: areaType
        mapping:
          CIRCLE: '#/components/schemas/Circle'
          POI: '#/components/schemas/Poi'
    AreaType-Geo-V0:
      type: string
      description: |
        Type of this area.
        CIRCLE - The area is defined as a circle.
        POI - The area is defined by a named point of interest.
      enum:
        - CIRCLE
        - POI
    Circle-Geo-V0:
      description: Circular area
      allOf:
        - $ref: '#/components/schemas/Area-Geo-V0'
        - type: object
          properties:
            center:
              $ref: '#/components/schemas/Point-Geo-V0'
            radius:
              type: integer
              description: >-
                Expected accuracy for the subscription event of device location in m, from location (radius)
              minimum: 2000
              maximum: 200000
          required:
            - center
            - radius
      example:
        areaType: CIRCLE
        center:
          latitude: 50.735851
          longitude: 7.10066
        radius: 50000
    Poi-Geo-V0:
      description: Point of interest area
      allOf:
        - $ref: '#/components/schemas/Area-Geo-V0'
        - type: object
          properties:
            poiName:
              type: string
              description: >-
                Name of the Point of Interest for geofencing and location verification.
          required:
            - poiName
      example:
        areaType: POI
        poiName: StatueOfLiberty
    Point-Geo-V0:
      type: object
      description: 'Coordinates (latitude, longitude) defining a location in a map'
      required:
        - latitude
        - longitude
      properties:
        latitude:
          $ref: '#/components/schemas/Latitude-Geo-V0'
        longitude:
          $ref: '#/components/schemas/Longitude-Geo-V0'
      example:
        latitude: 50.735851
        longitude: 7.10066
    Latitude-Geo-V0:
      description: Latitude component of a location
      type: number
      format: double
      minimum: -90
      maximum: 90
      example: 50.735851
    Longitude-Geo-V0:
      description: Longitude component of location
      type: number
      format: double
      minimum: -180
      maximum: 180
      example: 7.10066
    CloudEvent-Geo-V0:
      description: The notification callback
      required:
        - id
        - source
        - specversion
        - type
        - time
        - data
      properties:
        id:
          type: string
          description: 'identifier of this event, that must be unique in the source context.'
        source:
          $ref: '#/components/schemas/Source-Geo-V0'
        type:
          $ref: '#/components/schemas/NotificationEventType-Geo-V0'
        specversion:
          type: string
          description: >-
            Version of the specification to which this event conforms (must be 1.0 if it conforms to cloudevents 1.0.2 version)
          enum:
            - '1.0'
        datacontenttype:
          type: string
          description: >-
            media-type that describes the event payload encoding, must be "application/json" for CAMARA APIs
          enum:
            - application/json
        data:
          type: object
          description: >-
            Event details payload described in each CAMARA API and referenced by its type
        time:
          $ref: '#/components/schemas/DateTime-Geo-V0'
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.geofencing-subscriptions.v0.area-left: '#/components/schemas/EventAreaLeft'
          org.camaraproject.geofencing-subscriptions.v0.area-entered: '#/components/schemas/EventAreaEntered'
          org.camaraproject.geofencing-subscriptions.v0.subscription-ends: '#/components/schemas/EventSubscriptionEnds'
    Source-Geo-V0:
      type: string
      format: uri-reference
      minLength: 1
      description: >
        Identifies the context in which an event happened - be a non-empty `URI-reference` like:

        - URI with a DNS authority:




          * https://github.com/cloudevents
          * mailto:cncf-wg-serverless@lists.cncf.io
        - Universally-unique URN with a UUID:




          * urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
        - Application-specific identifier:




          * /cloudevents/spec/pull/123
          * 1-555-123-4567
      example: 'https://notificationSendServer12.supertelco.com'
    DateTime-Geo-V0:
      type: string
      format: date-time
      description: Timestamp of when the occurrence happened. Must adhere to RFC 3339.
      example: '2018-04-05T17:31:00Z'
    EventAreaLeft-Geo-V0:
      description: event structure for event when the device leaves the area
      allOf:
        - $ref: '#/components/schemas/CloudEvent-Geo-V0'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AreaLeft-Geo-V0'
    EventAreaEntered-Geo-V0:
      description: event structure for event when the device enters the area
      allOf:
        - $ref: '#/components/schemas/CloudEvent-Geo-V0'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AreaEntered-Geo-V0'
    EventSubscriptionEnds-Geo-V0:
      description: event structure for event subscription ends
      allOf:
        - $ref: '#/components/schemas/CloudEvent-Geo-V0'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SubscriptionEnds-Geo-V0'
    AreaLeft-Geo-V0:
      description: Event detail structure for area-left event
      type: object
      required:
        - device
        - area
        - subscriptionId
      properties:
        device:
          $ref: '#/components/schemas/Device-Geo-V0'
        area:
          $ref: '#/components/schemas/Area-Geo-V0'
        subscriptionId:
          $ref: '#/components/schemas/SubscriptionId-Geo-V0'
    AreaEntered-Geo-V0:
      description: Event detail structure for area-entered event
      type: object
      required:
        - device
        - area
        - subscriptionId
      properties:
        device:
          $ref: '#/components/schemas/Device-Geo-V0'
        area:
          $ref: '#/components/schemas/Area-Geo-V0'
        subscriptionId:
          $ref: '#/components/schemas/SubscriptionId-Geo-V0'
    SubscriptionEnds-Geo-V0:
      description: Event detail structure for SUBSCRIPTION_ENDS event
      type: object
      required:
        - device
        - area
        - terminationReason
        - subscriptionId
      properties:
        device:
          $ref: '#/components/schemas/Device-Geo-V0'
        area:
          $ref: '#/components/schemas/Area-Geo-V0'
        terminationReason:
          $ref: '#/components/schemas/TerminationReason-Geo-V0'
        terminationDescription:
          description: Explanation why a subscription ended or had to end.
          type: string
        subscriptionId:
          $ref: '#/components/schemas/SubscriptionId-Geo-V0'
    TerminationReason-Geo-V0:
      type: string
      description: >
        - NETWORK_TERMINATED - API server stopped sending notification

        - SUBSCRIPTION_UNPROCESSABLE - Subscription cannot be processed due to some reason, e.g. because the specified area cannot be managed. Useful for asynchronous subscription creation.

        - SUBSCRIPTION_EXPIRED - Subscription expire time (optionally set by the requester) has been reached

        - SUBSCRIPTION_DELETED - Subscription was deleted by the requester

        - MAX_EVENTS_REACHED - Maximum number of events (optionally set by the requester) has been reached

        - ACCESS_TOKEN_EXPIRED - Access Token sinkCredential (optionally set by the requester) expiration time has been reached

      enum:
        - MAX_EVENTS_REACHED
        - NETWORK_TERMINATED
        - SUBSCRIPTION_UNPROCESSABLE
        - SUBSCRIPTION_EXPIRED
        - SUBSCRIPTION_DELETED
        - ACCESS_TOKEN_EXPIRED
    HTTPSubscriptionRequest-Geo-V0:
      allOf:
