        '403':
          $ref: '#/components/responses/PhoneNumberVerificationPermissionDenied403-NV-V1'
        '500':
          $ref: '#/components/responses/Generic500-NV-V1'
        '503':
          $ref: '#/components/responses/Generic503-NV-V1'
        '504':
          $ref: '#/components/responses/Generic504-NV-V1'
      security:
        - openId:
            - 'number-verification:verify'
