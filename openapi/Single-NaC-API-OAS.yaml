    AMQPSubscriptionRequest-Geo-V0:
      allOf:
        - $ref: '#/components/schemas/SubscriptionRequest-Geo-V0'
        - type: object
          properties:
            protocolSettings:
              $ref: '#/components/schemas/AMQPSettings-Geo-V0'
    AMQPSubscriptionResponse-Geo-V0:
      allOf:
        - $ref: '#/components/schemas/Subscription-Geo-V0'
        - type: object
