      required:
        - devicePhoneNumber
      properties:
        devicePhoneNumber:
          $ref: '#/components/schemas/DevicePhoneNumber-NV-V1'
    DevicePhoneNumber-NV-V1:
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: '+123456789'
      description: >-
        A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
    DevicePhoneNumberVerified-NV-V1:
      description: 'Number verification. True, if it matches'
      type: boolean
    ErrorInfo-NV-V1:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          description: HTTP response status code
        code:
          type: string
          description: Code given to this error
        message:
          type: string
          description: Detailed error description
    VerifyRequestBody-KYC-AV-V0:
      type: object
      description: Request to verify the age threshold provided.
      required:
        - ageThreshold
      properties:
        ageThreshold:
          $ref: '#/components/schemas/AgeThreshold-KYC-AV-V0'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber-KYC-AV-V0'
        idDocument:
          $ref: '#/components/schemas/IdDocument-KYC-AV-V0'
        name:
          $ref: '#/components/schemas/Name-KYC-AV-V0'
        givenName:
          $ref: '#/components/schemas/GivenName-KYC-AV-V0'
        familyName:
          $ref: '#/components/schemas/FamilyName-KYC-AV-V0'
        middleNames:
          $ref: '#/components/schemas/MiddleNames-KYC-AV-V0'
        familyNameAtBirth:
          $ref: '#/components/schemas/FamilyNameAtBirth-KYC-AV-V0'
        birthdate:
          $ref: '#/components/schemas/Birthdate-KYC-AV-V0'
        email:
          $ref: '#/components/schemas/Email-KYC-AV-V0'
        includeContentLock:
          $ref: '#/components/schemas/IncludeContentLock-KYC-AV-V0'
        includeParentalControl:
          $ref: '#/components/schemas/IncludeParentalControl-KYC-AV-V0'
    AgeThreshold-KYC-AV-V0:
      type: integer
      minimum: 0
      maximum: 120
      description: >-
        The age to be verified. The indicated range is a global definition of maximum and minimum values allowed to be requested. It is important to note that this range might be more restrictive in some implementations due to local regulations of a country i.e. A country does not allow to request for an age under 18. This limitation must be informed during the onboarding process.
    PhoneNumber-KYC-AV-V0:
      description: >-
        A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      example: '+99999991000'
    IdDocument-KYC-AV-V0:
      type: string
      description: >-
        Id number associated to the official identity document in the country. It may contain alphanumeric characters.
    Name-KYC-AV-V0:
      type: string
      description: >-
        Complete name of the customer, usually composed of first/given name and last/family/sur- name in a country.  Depending on the country, the order of first/give name and last/family/sur- name varies, and middle name could be included.  It can use givenName, middleNames, familyName and/or familyNameAtBirth. For example, in ESP, name+familyName; in NLD, it can be name+middleNames+familyName or name+middleNames+familyNameAtBirth, etc.
    GivenName-KYC-AV-V0:
      type: string
      description: First/given name or compound first/given name of the customer.
    FamilyName-KYC-AV-V0:
      type: string
      description: 'Last name, family name, or surname of the customer.'
    MiddleNames-KYC-AV-V0:
      type: string
      description: Middle name/s of the customer.
    FamilyNameAtBirth-KYC-AV-V0:
      type: string
      description: Last/family/sur- name at birth of the customer.
    Birthdate-KYC-AV-V0:
      type: string
      format: date
      description: >-
        The birthdate of the customer, in RFC 3339 / ISO 8601 calendar date format (YYYY-MM-DD).
    Email-KYC-AV-V0:
      type: string
      format: email
      description: >-
        Email address of the customer in the RFC specified format (local-part@domain).
    IncludeContentLock-KYC-AV-V0:
      type: boolean
      default: false
      description: >-
        If this parameter is included in the request with value `true`, the response property `contentLock` will be returned. If it is not included or its value is `false`, the response property will not be returned.
    IncludeParentalControl-KYC-AV-V0:
      type: boolean
      default: false
      description: >-
        If this parameter is included in the request with value `true`, the response property `parentalControl` will be returned. If it is not included or its value is `false`, the response property will not be returned.
    VerifyResponseBody-KYC-AV-V0:
      type: object
      description: Response to an age verification request
      required:
        - ageCheck
      properties:
        ageCheck:
          $ref: '#/components/schemas/AgeCheck-KYC-AV-V0'
        verifiedStatus:
          $ref: '#/components/schemas/VerifiedStatus-KYC-AV-V0'
        identityMatchScore:
          $ref: '#/components/schemas/IdentityMatchScore-KYC-AV-V0'
        contentLock:
          $ref: '#/components/schemas/ContentLock-KYC-AV-V0'
        parentalControl:
          $ref: '#/components/schemas/ParentalControl-KYC-AV-V0'
    AgeCheck-KYC-AV-V0:
      type: string
      description: >-
        Indicate `"true"` when the age of the user is the same age or older than the age threshold (age >= age threshold), and `"false"` if not (age < age threshold). If the API Provider doesn't have enough information to perform the validation, a `not_available` can be returned.
      enum:
        - 'true'
        - 'false'
        - not_available
    VerifiedStatus-KYC-AV-V0:
      type: boolean
      description: >-
        Indicate `true` if the information provided has been compared against information based on an identification document legally accepted as an age verification document, otherwise indicate `false`.
    IdentityMatchScore-KYC-AV-V0:
      type: integer
      minimum: 0
      maximum: 100
      description: >-
        The overall score of identity information available in the API Provider, information either provided in the request body comparing it to the one that the API Provider holds or directly using internal API Provider's information. It is optional for the API Provider to return the Identity match score.
    ContentLock-KYC-AV-V0:
      type: string
      description: >-
        Indicate `"true"` if the subscription associated with the phone number has any kind of content lock (i.e certain web content blocked) and `"false"` if not. If the information is not available the value `not_available` can be returned.
      enum:
        - 'true'
        - 'false'
        - not_available
    ParentalControl-KYC-AV-V0:
      type: string
      description: >-
        Indicate `"true"` if the subscription associated with the phone number has any kind of parental control activated and `"false"` if not. If the information is not available the value `not_available` can be returned.
      enum:
        - 'true'
        - 'false'
        - not_available
    ErrorInfo-KYC-AV-V0:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          description: HTTP response status code
        code:
          type: string
          description: Code given to this error
        message:
          type: string
          description: Detailed error description
    KYC_MatchRequestBody-KYC-M-V0:
      type: object
      description: Payload to validate the customer data.
      properties:
        phoneNumber:
          type: string
          description: >-
            A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
          pattern: '^\+[1-9][0-9]{4,14}$'
          example: '+123456789'
        idDocument:
          type: string
          description: >-
            Id number associated to the official identity document in the country. It may contain alphanumeric characters.
        name:
          type: string
          description: >-
            Complete name of the customer, usually composed of first/given name and last/family/sur- name in a country.  Depending on the country, the order of first/give name and last/family/sur- name varies, and middle name could be included.  It can use givenName, middleNames, familyName and/or familyNameAtBirth. For example, in ESP, name+familyName; in NLD, it can be name+middleNames+familyName or name+middleNames+familyNameAtBirth, etc.
        givenName:
          type: string
          description: First/given name or compound first/given name of the customer.
        familyName:
          type: string
          description: 'Last name, family name, or surname of the customer.'
        nameKanaHankaku:
          type: string
          description: >-
            Complete name of the customer in Hankaku-Kana format (reading of name) for Japan.
        nameKanaZenkaku:
          type: string
          description: >-
            Complete name of the customer in Zenkaku-Kana format (reading of name) for Japan.
        middleNames:
          type: string
          description: Middle name/s of the customer.
        familyNameAtBirth:
          type: string
          description: Last/family/sur- name at birth of the customer.
        address:
          type: string
          description: >-
            Complete address of the customer.  For some countries, it is built following the usual concatenation of parameters in a country, but for other countries, this is not the case.  For some countries, it can use streetName, streetNumber and/or houseNumberExtension. For example, in ESP, streetName+streetNumber; in NLD, it can be streetName+streetNumber or streetName+streetNumber+houseNumberExtension.
        streetName:
          type: string
          description: >-
            Name of the street of the customer's address. It should not include the type of the street.
        streetNumber:
          type: string
          description: >-
            The street number of the customer's address.  Number identifying a specific property on the 'streetName'.
        postalCode:
          type: string
          description: Zip code or postal code
        region:
          type: string
          description: Region/prefecture of the customer's address
        locality:
