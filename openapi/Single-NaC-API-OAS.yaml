      description: A sample geofence for entering for a circle area
      value:
        protocol: HTTP
        sink: 'https://notificationSendServer12.supertelco.com'
        types:
          - org.camaraproject.geofencing-subscriptions.v0.area-entered
        config:
          subscriptionDetail:
            device:
              phoneNumber: '+99999991000'
            area:
              areaType: CIRCLE
              center:
                latitude: 50.735851
                longitude: 7.10066
              radius: 2000
          initialEvent: true
          subscriptionMaxEvents: 10
          subscriptionExpireTime: '2045-03-22T05:40:58.469Z'
    REQUEST_CIRCLE_AREA_LEFT-Geo-V0:
      description: A sample geofence for leaving a circle area
      value:
