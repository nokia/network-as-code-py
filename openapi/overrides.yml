paths:
  # Congestion Insights
  /congestion-insights/v0/subscriptions:
    post:
      x-fern-sdk-group-name: congestion_insights
      x-fern-sdk-method-name: create_subscription
    get:
      x-fern-sdk-group-name: congestion_insights
      x-fern-sdk-method-name: list_subscriptions
  /congestion-insights/v0/subscriptions/{resource_id}:
    get:
      x-fern-sdk-group-name: congestion_insights
      x-fern-sdk-method-name: get_subscription
    delete:
      x-fern-sdk-group-name: congestion_insights
      x-fern-sdk-method-name: delete_subscription
  /congestion-insights/v0/query:
    post:
      x-fern-sdk-group-name: congestion_insights
      x-fern-sdk-method-name: query

  # QoD
  /qod/v0/sessions:
    post:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: create_session
    get:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: list_sessions
  /qod/v0/sessions/{sessionId}:
    get:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: get_session
    delete:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: delete_session
  /qod/v0/sessions/{sessionId}/extend:
    post:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: extend_session
  /qod/v0/retrieve-sessions:
    post:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: retrieve_sessions

  # Quality on Demand (v1)
  /quality-on-demand/v1/sessions:
    post:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: create_session_v1
    get:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: list_sessions_v1
  /quality-on-demand/v1/sessions/{sessionId}:
    get:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: get_session_v1
    delete:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: delete_session_v1
  /quality-on-demand/v1/sessions/{sessionId}/extend:
    post:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: extend_session_v1
  /quality-on-demand/v1/retrieve-sessions:
    post:
      x-fern-sdk-group-name: qod
      x-fern-sdk-method-name: retrieve_sessions_v1

  # Device Status
  /device-status/v0/subscriptions:
    post:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: create_subscription
    get:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: list_subscriptions
  /device-status/v0/subscriptions/{subscriptionId}:
    get:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: get_subscription
    delete:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: delete_subscription
  /device-status/v0/roaming:
    post:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: check_roaming
  /device-status/v0/connectivity:
    post:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: check_connectivity

  # Device Status - Roaming Subscriptions
  /device-status/device-roaming-status-subscriptions/v0.7/subscriptions:
    post:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: create_roaming_subscription
    get:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: list_roaming_subscriptions
  /device-status/device-roaming-status-subscriptions/v0.7/subscriptions/{subscriptionId}:
    get:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: get_roaming_subscription
    delete:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: delete_roaming_subscription
  /device-status/device-roaming-status/v1/retrieve:
    post:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: retrieve_roaming_status

  # Device Status - Reachability Subscriptions
  /device-status/device-reachability-status-subscriptions/v0.7/subscriptions:
    post:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: create_reachability_subscription
    get:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: list_reachability_subscriptions
  /device-status/device-reachability-status-subscriptions/v0.7/subscriptions/{subscriptionId}:
    get:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: get_reachability_subscription
    delete:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: delete_reachability_subscription
  /device-status/device-reachability-status/v1/retrieve:
    post:
      x-fern-sdk-group-name: device_status
      x-fern-sdk-method-name: retrieve_reachability_status

  # Device Attach
  /device-attach/v0/attachments:
    post:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: attach_device
    get:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: get_device_attachments
  /device-attach/v0/attachments/{resource_id}:
    get:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: get_device_attachment
    delete:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: delete_device_attachment
  /device-attach/v0/attachments/subscribers/{operation}:
    post:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: subscriber_operation

  # Location
  /location-verification/v0/verify:
    post:
      x-fern-sdk-group-name: location
      x-fern-sdk-method-name: verify
  /location-verification/v1/verify:
    post:
      x-fern-sdk-group-name: location
      x-fern-sdk-method-name: verify_v1
  /location-retrieval/v0/retrieve:
    post:
      x-fern-sdk-group-name: location
      x-fern-sdk-method-name: retrieve

  # Geofencing
  /geofencing-subscriptions/v0.3/subscriptions:
    post:
      x-fern-sdk-group-name: geofencing
      x-fern-sdk-method-name: create_subscription
    get:
      x-fern-sdk-group-name: geofencing
      x-fern-sdk-method-name: list_subscriptions
  /geofencing-subscriptions/v0.3/subscriptions/{subscriptionId}:
    get:
      x-fern-sdk-group-name: geofencing
      x-fern-sdk-method-name: get_subscription
    delete:
      x-fern-sdk-group-name: geofencing
      x-fern-sdk-method-name: delete_subscription

  # Slice
  /slice/v1/slices:
    post:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: create_slice
    get:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: list_slices
  /slice/v1/slices/{id}:
    get:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: get_slice
    delete:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: delete_slice
  /slice/v1/slices/{id}/activate:
    post:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: activate
  /slice/v1/slices/{id}/deactivate:
    post:
      x-fern-sdk-group-name: slice
      x-fern-sdk-method-name: deactivate

  # OAuth
  /oauth2/v1/auth/clientcredentials:
    get:
      x-fern-sdk-group-name: oauth
      x-fern-sdk-method-name: get_client_credentials
